{% if v is None %}<span class="ds-delta flat" title="No hay ventas en el período anterior para comparar">sin base</span>{% elif v > 0 %}<span class="ds-delta up"><i class="bi bi-arrow-up-right"></i>{{ v|floatformat:1 }}%</span>{% elif v < 0 %}<span class="ds-delta down"><i class="bi bi-arrow-down-right"></i>{{ v|floatformat:1 }}%</span>{% else %}<span class="ds-delta flat">0%</span>{% endif %}
