{% extends 'base.html' %}

{% block title %}Página no encontrada | {{ app_name|default:"Tiendita SaaS" }}{% endblock %}

{% block extra_css %}
<style>
    .notfound-wrap {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
    }
    .notfound-card {
        max-width: 460px;
        text-align: center;
    }
    .notfound-code {
        font-size: 4rem;
        font-weight: 800;
        color: #cbd5e1;
        line-height: 1;
        margin-bottom: 1rem;
    }
    .notfound-title {
        font-weight: 800;
        font-size: 1.75rem;
        color: #1e293b;
        margin-bottom: 0.75rem;
    }
    .notfound-text {
        color: #64748b;
        margin-bottom: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="notfound-wrap">
    <div class="notfound-card">
        <div class="notfound-code">404</div>
        <h1 class="notfound-title">Página no encontrada</h1>
        <p class="notfound-text">La dirección que buscas no existe o fue movida.</p>
        <a href="{% url 'dashboard_router' %}" class="btn btn-primary px-4 py-2 rounded-pill fw-bold shadow-sm">
            <i class="bi bi-house-door me-2"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
