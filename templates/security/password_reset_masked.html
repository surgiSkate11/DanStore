{% extends 'security/auth_base.html' %}

{% block title %}Confirmar Correo{% endblock %}

{% block content %}
<div class="auth-header">
    <div class="logo-icon" style="background: #e0e7ff; color: #4f46e5; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);"><i class="bi bi-shield-check"></i></div>
    <h2 class="fw-bold mb-1" style="color: #1e293b;">Cuenta Encontrada</h2>
    <p class="text-muted small">Por tu seguridad, hemos ocultado parte de la información.</p>
</div>

<form method="post">
    {% csrf_token %}
    <div class="text-center mb-4 p-3 rounded" style="background: #f8fafc; border: 2px dashed #cbd5e1;">
        <p class="mb-1 fw-bold text-muted" style="font-size: 0.85rem;">Enviaremos el enlace al correo:</p>
        <h4 class="fw-bold mb-0 text-primary" style="letter-spacing: 1px;">{{ correo_oculto }}</h4>
    </div>
    
    <button type="submit" class="btn-auth mt-2">Enviar Enlace Seguro <i class="bi bi-envelope ms-1"></i></button>
</form>
{% endblock %}
