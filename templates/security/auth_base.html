<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autenticación{% endblock %} - Tiendita</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        .auth-wrapper {
            width: 100%;
            max-width: 420px;
        }
        
        .auth-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            background: #ffffff;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header .logo-icon {
            font-size: 2.8rem;
            color: #4f46e5;
            background: #e0e7ff;
            width: 80px; 
            height: 80px;
            border-radius: 50%;
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }
        
        /* Inputs genéricos para que los formularios automáticos de Django luzcan bien */
        .form-control, input[type="text"], input[type="email"], input[type="password"] {
            border-radius: 14px;
            padding: 0.85rem 1.2rem;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        
        .form-control:focus, input:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .form-label, label {
            font-weight: 700;
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .btn-auth {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border: none;
            border-radius: 14px;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4);
            color: white;
        }
        
        .auth-link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        
        .auth-link:hover {
            color: #3730a3;
            text-decoration: underline;
        }
        
        .alert-custom {
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            background-color: #fef2f2;
            color: #b91c1c;
            border-left: 4px solid #ef4444;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }
        
        /* Errores automáticos de Django */
        ul.errorlist {
            color: #b91c1c;
            font-size: 0.85rem;
            font-weight: 600;
            padding-left: 1rem;
            margin-top: 0.5rem;
        }
        
        .helptext {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.5rem;
            display: block;
        }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="card-body p-4 p-md-5">
                {% block content %}{% endblock %}
            </div>
            <div class="bg-light text-center py-3 border-top">
                <p class="mb-0 text-muted" style="font-size: 0.8rem;">
                    <i class="bi bi-shield-check text-success"></i> Acceso seguro y encriptado
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
