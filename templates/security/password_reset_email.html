<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; padding: 20px; color: #1e293b;">
    <div style="max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
        <h2 style="color: #4f46e5; margin-bottom: 20px;">Tiendita</h2>
        <h3 style="color: #1e293b;">Recuperación de Contraseña</h3>
        <p style="color: #64748b; margin-bottom: 30px;">Hola, hemos recibido una solicitud para restablecer tu contraseña. Haz clic en el botón de abajo para crear una nueva:</p>
        
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" 
           style="background-color: #4f46e5; color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">
           Restablecer Contraseña
        </a>
        
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 30px;">Si no solicitaste este cambio, puedes ignorar este correo de forma segura. El enlace expirará automáticamente.</p>
    </div>
</body>
</html>
