{% extends 'security/auth_base.html' %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="auth-header">
    <div class="logo-icon"><i class="bi bi-key"></i></div>
    <h2 class="fw-bold mb-1" style="color: #1e293b;">Recuperar Acceso</h2>
    <p class="text-muted small">Ingresa tu nombre de usuario para buscar tu cuenta</p>
</div>

<form method="post" novalidate>
    {% csrf_token %}
    
    {% if error_message %}
    <div class="alert-custom mb-3">
        <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i> {{ error_message }}
    </div>
    {% endif %}
    
    <div class="mb-4">
        <label for="username" class="form-label">Nombre de Usuario</label>
        <input type="text" name="username" class="form-control" id="username" placeholder="ej: juan_perez" required autofocus oninvalid="this.setCustomValidity('Ingresa tu nombre de usuario.')" oninput="this.setCustomValidity('')">
    </div>
    <button type="submit" class="btn-auth mt-2">Siguiente Paso <i class="bi bi-arrow-right ms-1"></i></button>
    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="auth-link" style="text-decoration: none;">Volver al Login</a>
    </div>
</form>
{% endblock %}
