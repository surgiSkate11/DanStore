{% extends 'security/auth_base.html' %}

{% block title %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="auth-header">
    <div class="logo-icon" style="background: #d1fae5; color: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);"><i class="bi bi-check-circle"></i></div>
    <h2 class="fw-bold mb-1" style="color: #1e293b;">¡Todo Listo!</h2>
    <p class="text-muted small">Tu contraseña ha sido actualizada exitosamente.</p>

<div class="text-center">
    <a href="{% url 'login' %}" class="btn-auth mt-3">Ingresar a mi cuenta <i class="bi bi-box-arrow-in-right ms-1"></i></a>
</div>
{% endblock %}
