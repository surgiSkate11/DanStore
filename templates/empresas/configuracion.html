{% extends 'base.html' %}

{% block title %}Configuración | {{ empresa.nombre }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <h2 class="fw-bolder mb-4 text-dark"><i class="bi bi-palette text-primary me-2"></i> Diseño de Tienda</h2>
            
            <form method="post" class="card border-0" style="border-radius: 20px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); border: 1px solid rgba(226,232,240,0.8);">
                {% csrf_token %}
                <div class="card-body p-4 p-md-5">
                    
                    <h5 class="fw-bold mb-4 border-bottom pb-3 text-dark">Diseño y Marca</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Título Principal</label>
                            <input type="text" name="landing_titulo" class="form-control form-control-lg bg-light border-0" value="{{ empresa.landing_titulo }}" placeholder="Ej: Bienvenidos a mi Tienda" style="border-radius: 12px;">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Color de Marca</label>
                            <input type="color" name="color_primario" class="form-control form-control-color w-100 border-0 shadow-sm" value="{{ empresa.color_primario }}" title="Elige el color de tu marca" style="height: 48px; border-radius: 12px; cursor: pointer;">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Mensaje de Bienvenida</label>
                            <textarea name="landing_descripcion" class="form-control bg-light border-0" rows="2" style="border-radius: 12px;">{{ empresa.landing_descripcion }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Banner Promocional Superior</label>
                            <input type="text" name="mensaje_promocional" class="form-control bg-light border-0" value="{{ empresa.mensaje_promocional }}" placeholder="Ej: ¡Envío gratis a todo el país!" style="border-radius: 12px;">
                        </div>
                    </div>

                    <h5 class="fw-bold mb-4 border-bottom pb-3 mt-5 text-dark">Redes Sociales y Contacto</h5>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;"><i class="bi bi-whatsapp text-success me-1"></i> WhatsApp</label>
                            <input type="text" name="telefono_whatsapp" class="form-control bg-light border-0" value="{{ empresa.telefono_whatsapp }}" placeholder="Ej: 593991234567" style="border-radius: 12px;">
                            <small class="text-muted">Sin el símbolo +, solo números.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;"><i class="bi bi-instagram text-danger me-1"></i> Instagram URL</label>
                            <input type="url" name="instagram_url" class="form-control bg-light border-0" value="{{ empresa.instagram_url }}" placeholder="https://instagram.com/tu_tienda" style="border-radius: 12px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;"><i class="bi bi-facebook text-primary me-1"></i> Facebook URL</label>
                            <input type="url" name="facebook_url" class="form-control bg-light border-0" value="{{ empresa.facebook_url }}" placeholder="https://facebook.com/tu_tienda" style="border-radius: 12px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;"><i class="bi bi-youtube text-danger me-1"></i> YouTube URL</label>
                            <input type="url" name="youtube_url" class="form-control bg-light border-0" value="{{ empresa.youtube_url }}" placeholder="https://youtube.com/..." style="border-radius: 12px;">
                        </div>
                    </div>

                </div>
                <div class="card-footer bg-white border-top p-4 d-flex justify-content-end" style="border-radius: 0 0 20px 20px;">
                    <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill fw-bold shadow-sm">Guardar Preferencias</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
